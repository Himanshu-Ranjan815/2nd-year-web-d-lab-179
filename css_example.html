
<html>
<head>
    <title>CSS Example</title>

    <style>
        body {
            background-image: url("bg.jpg");
            background-color: lightblue;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        .left {
            color: red;
            font-family: Arial;
            font-size: 20px;
            text-align: left;
        }

        .center {
            color: green;
            font-family: Georgia;
            text-align: center;
            text-decoration: underline;
        }

        .right {
            color: purple;
            font-family: Tahoma;
            text-align: right;
            font-style: italic;
        }

        .box {
            background-image: url("box.jpg");
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Styling Example</h1>

    <p class="left">This is left aligned text.</p>

    <p class="center">This is centered text.</p>

    <p class="right">This is right aligned text.</p>

    <p class="box">This paragraph has a background image.</p>

</body>
</html>
